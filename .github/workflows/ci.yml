name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    name: Validate manifests + frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bin/validate
        run: bin/validate

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning

  # The PreToolUse guard hooks against tests/*-cases.txt. Pinned to an LTS image
  # rather than ubuntu-latest, so a label move cannot silently change the awk
  # under test. No --sandbox: the runner is disposable and the hooks never
  # evaluate their input; local runs keep --sandbox.
  hook-tests:
    name: Hook test cases
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Show which awk the hooks will use
        run: readlink -f "$(command -v awk)"
      - name: Run bin/test-hooks against config/hooks/
        run: bin/test-hooks --repo
      - name: Also run under mawk, if it is not already the default
        run: |
          mawk_bin=$(command -v mawk || true)
          if [ -n "$mawk_bin" ] && [ "$(readlink -f "$(command -v awk)")" != "$(readlink -f "$mawk_bin")" ]; then
            bin/test-hooks --repo --awk "$mawk_bin"
          else
            echo "mawk is the default awk, or absent; nothing more to run"
          fi

  json-parse:
    name: JSON parse check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all JSON files parse cleanly
        run: |
          find . -name "*.json" -not -path "./.git/*" | while read -r f; do
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done
