schema_version: "1.1"
name: readme-ab
description: >
  Write a README for the boutiques plugin. Without-arm: no guidance. With-arm: tech-docs, which
  should delegate to technical-docs-writer. The STE score comes from score_readmes.py after the
  run, because graders cannot run the checker.
tags: [readme]
runs: 2
execution:
  model: sonnet
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Agent, Skill, Write, Edit, Bash]
  prompt: |
    ./boutiques/ is a Claude Code plugin. Read it and write ./README.md for it: what it does,
    how to install it, and how to use each skill or command. The project's declared technical
    terms are in ./.tech-terms.
context:
  scaffold_script: fixture.sh
graders:
  - name: readme-written
    type: file_exists
    path: README.md
  - name: names-schema-0.5
    type: regex
    target: {source: file, path: README.md}
    pattern: '0\.5'
  - name: names-bosh
    type: regex
    target: {source: file, path: README.md}
    pattern: '\bbosh\b'
  - name: covers-help-parsing
    type: regex
    target: {source: file, path: README.md}
    pattern: '--help'
  - name: delegated-to-agent
    type: tool_used
    tool: Agent
    input_match: 'technical-docs-writer'
    arm: with-only
