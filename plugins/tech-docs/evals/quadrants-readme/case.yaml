schema_version: "1.1"
name: quadrants-readme
description: >
  Classify the sections of the repo's root README by quadrant and compare with hand labels.
  Read-only: the skill must not edit.
tags: [quadrants]
runs: 1
execution:
  model: haiku
  max_turns: 15
  allowed_tools: [Read, Glob, Grep, Skill, Agent, Write, Edit]
  prompt: |
    Classify each section of ./README.md by documentation quadrant (Diátaxis). Do not change
    the file.
context:
  scaffold_script: fixture.sh
graders:
  - name: used-doc-quadrants
    type: tool_used
    tool: Skill
    input_match: 'doc-quadrants'
  - name: file-not-edited
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both
  - name: matches-hand-labels
    type: llm
    focus: last_message
    criteria: |
      TODO: hand labels pending from the user. Fill in one line per section, then PASS when the
      reply gives the same label for at least N of them.
