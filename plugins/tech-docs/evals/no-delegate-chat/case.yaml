schema_version: "1.1"
name: no-delegate-chat
description: A should-not-delegate trigger. A chat question about STE, not a doc to write.
tags: [trigger]
runs: 1
execution:
  model: haiku
  max_turns: 5
  allowed_tools: [Read, Glob, Grep, Agent, Skill]
  prompt: |
    In two sentences, what is ASD-STE100 Simplified Technical English?
graders:
  - name: did-not-delegate
    type: tool_used
    tool: Agent
    input_match: 'technical-docs-writer'
    min: 0
    max: 0
    arm: both
  - name: answered
    type: regex
    target: last_message
    pattern: 'controlled language|vocabulary|dictionary'
    flags: i
